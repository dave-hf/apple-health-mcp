[program:health-ingest]
command=/opt/health/ingest/venv/bin/uvicorn main:app --host 127.0.0.1 --port 8001
directory=/opt/health/ingest
user=www
autostart=true
autorestart=true
; Secrets are loaded from /opt/health/.env by the application via python-dotenv,
; so do NOT duplicate HEALTH_TOKEN here.
stdout_logfile=/opt/health/ingest/access.log
stderr_logfile=/opt/health/ingest/error.log
