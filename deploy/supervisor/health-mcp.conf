[program:health-mcp]
command=/opt/health/ingest/venv/bin/python server.py
directory=/opt/health/mcp
user=www
autostart=true
autorestart=true
; Secrets are loaded from /opt/health/.env by the application via python-dotenv,
; so do NOT duplicate HEALTH_TOKEN here.
stdout_logfile=/opt/health/mcp/access.log
stderr_logfile=/opt/health/mcp/error.log
