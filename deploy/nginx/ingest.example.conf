# Reverse-proxy template for the ingest service.
#
# Replace `health.example.com` with your own subdomain. Issue an SSL cert
# (Let's Encrypt via certbot or your panel) and point the cert paths below
# at the issued files.
#
# This config can live in /etc/nginx/sites-enabled/ or, if you use aaPanel,
# under /www/server/panel/vhost/nginx/.

server {
    listen 80;
    server_name health.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name health.example.com;

    ssl_certificate     /path/to/fullchain.pem;
    ssl_certificate_key /path/to/privkey.pem;

    # Apple Health exports can exceed the default 1 MB body limit.
    client_max_body_size 50M;

    location /health {
        proxy_pass http://127.0.0.1:8001/health;
    }

    location /ingest {
        proxy_pass http://127.0.0.1:8001/ingest;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For  $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
