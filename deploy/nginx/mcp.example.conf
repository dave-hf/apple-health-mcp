# Reverse-proxy template for the MCP server.
#
# Important: this server block does NOT enable HTTP/2. The `mcp` SDK 1.27.x
# returns 421 "Misdirected Request" on some HTTP/2 paths during the
# Streamable-HTTP handshake. Plain HTTP/1.1 over TLS is the safe choice.
#
# If your control panel (e.g. aaPanel) forces http2 on the main vhost,
# put the MCP service on a separate subdomain so this listener can stay
# HTTP/1.1 only.

server {
    listen 80;
    server_name mcp.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;            # NOTE: no `http2` here, by design.
    server_name mcp.example.com;

    ssl_certificate     /path/to/fullchain.pem;
    ssl_certificate_key /path/to/privkey.pem;

    location /mcp {
        proxy_pass http://127.0.0.1:8002;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For  $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Streamable-HTTP responses can be long-lived SSE streams.
        proxy_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
